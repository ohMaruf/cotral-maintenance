[project]
name = "cotral-maintenance"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.4.0",
    "mlx>=0.32.3,<0.33",
    "mlx-lm>=0.32,<0.33",
    "mlx-vlm>=0.7.4,<0.8",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
review = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]
osm = [
    "osmium>=4.3.2",
]
agent = [
    "mcp>=1.20",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
