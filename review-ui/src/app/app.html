<header class="top">
  <a class="brand" routerLink="/results">Stop review</a>
  <nav aria-label="Main">
    <a routerLink="/results" routerLinkActive="active" ariaCurrentWhenActive="page">Results</a>
    <a routerLink="/scores" routerLinkActive="active" ariaCurrentWhenActive="page">Scores</a>
    <a routerLink="/versus" routerLinkActive="active" ariaCurrentWhenActive="page">Versus</a>
    <a routerLink="/explore" routerLinkActive="active" ariaCurrentWhenActive="page">Explore</a>
    <a routerLink="/shapes" routerLinkActive="active" ariaCurrentWhenActive="page">Shapes</a>
  </nav>
  <button
    type="button"
    class="theme"
    [attr.aria-label]="'Theme: ' + themeLabel() + '. Activate to change.'"
    (click)="theme.cycle()"
  >
    {{ themeLabel() }}
  </button>
</header>
<main>
  <router-outlet />
</main>
